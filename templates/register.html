{% extends "base.html" %}
{% block title %}Register — EduCore{% endblock %}

{% block head_extra %}
<style>
#dept-row { display: block; }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-user-plus"></i> Register — EduCore</h4>
                    <small class="opacity-75">Your application will be reviewed before activation.</small>
                </div>
                <div class="card-body">
                    <form method="POST" id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" name="first_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" name="last_name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username *</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" placeholder="Optional">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password *</label>
                            <input type="password" class="form-control" name="password" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role *</label>
                            <select class="form-select" name="role" id="roleSelect" required>
                                <option value="student">Student</option>
                                <option value="teacher">Faculty</option>
                            </select>
                        </div>
                        <div class="mb-3" id="dept-row">
                            <label class="form-label">Department *</label>
                            <select class="form-select" name="department_id" id="deptSelect">
                                <option value="">— Select Department —</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.dept_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane"></i> Submit Registration
                        </button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('student_login') }}">Already have an account? Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    const dept = document.getElementById('deptSelect').value;
    if (!dept) {
        e.preventDefault();
        alert('Please select a department.');
    }
});
</script>
{% endblock %}
